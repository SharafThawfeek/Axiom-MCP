name: axiom-mcp

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: axiom-mcp-postgres

    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: password
      POSTGRES_DB: axiom_mcp

    ports:
      - "5435:5432"

    volumes:
      - axiom_mcp_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  axiom_mcp_postgres_data:
