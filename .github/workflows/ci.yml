name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The standalone installer rather than a pinned setup action: uv
      # resolves and caches its own environment from uv.lock, so the action's
      # main contribution would be a version number to keep current.
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # --frozen: fail if uv.lock and pyproject.toml have drifted, rather
      # than silently re-resolving. CI must test the pinned set, not a fresh
      # resolution that nobody has run locally.
      - name: Install dependencies
        run: uv sync --frozen --extra server --extra indexer

      # Previously unenforced — ruff.toml existed but nothing ran it.
      - name: Lint
        run: uv run ruff check backend .github

      - name: Run tests
        run: uv run pytest -q

  # Enforces the architectural invariant that makes `uvx axiom-debug-mcp`
  # viable: the published wheel must install without FastAPI, a Postgres
  # driver, pgvector, or any LLM client. Those live behind optional extras.
  # Without this check the base dependency list rots the first time someone
  # adds a convenient top-level import, and nobody notices until a user's
  # zero-infrastructure install pulls 400MB.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build wheel
        run: uv build --wheel

      - name: Install into a clean environment
        run: |
          uv venv /tmp/lean
          VIRTUAL_ENV=/tmp/lean uv pip install --prerelease=allow dist/*.whl

      - name: Assert no heavy dependency leaked in
        run: |
          BANNED='^(fastapi|asyncpg|psycopg2|psycopg2-binary|pgvector|groq|openai|langsmith|alembic) '
          if VIRTUAL_ENV=/tmp/lean uv pip list | grep -iE "$BANNED"; then
            echo "::error::A server-only dependency leaked into the base install."
            exit 1
          fi
          echo "Lean install verified."

      - name: Smoke-test the stdio entrypoint
        # Boots the installed console script and asks it for its tool list
        # over real JSON-RPC framing. Catches the class of break that unit
        # tests cannot: a stray stdout write corrupting the protocol.
        run: |
          VIRTUAL_ENV=/tmp/lean uv pip install --prerelease=allow fastmcp==4.0.0b2
          AXIOM_MEMORY_URL="sqlite+aiosqlite:////tmp/ci-memory.db" \
          AXIOM_PROJECT_ID=ci \
          /tmp/lean/bin/python - <<'PY'
          import asyncio
          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport

          async def main():
              t = StdioTransport(command="/tmp/lean/bin/axiom-debug-mcp", args=[])
              async with Client(t) as c:
                  names = sorted(x.name for x in await c.list_tools())
                  print("tools:", names)
                  assert "recall_failure_memory" in names, names
                  result = await c.call_tool(
                      "parse_failure",
                      {"log": 'Traceback (most recent call last):\n'
                              '  File "a.py", line 1, in f\n'
                              'ValueError: bad input\n'},
                  )
                  assert result.data.exception_type == "ValueError", result.data
                  print("signature:", result.data.signature)

          asyncio.run(main())
          PY

  # On a CI failure, ask Axiom Debug what went wrong. AXIOM_MODE (a repo
  # variable) picks how far it goes:
  #   manual    (default) — post the diagnosis as a PR comment. Nothing else
  #             touches git.
  #   review    — same, plus any suggested fix shown as a reviewable diff.
  #   automatic — apply the fix on a new branch, run the test suite, and
  #             only if that's clean, push the branch and open a PR. Never
  #             commits to the branch that triggered it.
  # Requires AXIOM_API_URL (a repo variable) pointing at a reachable Axiom
  # Debug deployment; skips cleanly if it isn't set, since GitHub's runners
  # can't reach a developer's localhost.
  report-failure:
    needs: test
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Specifying this key sets every unlisted scope to `none` — actions:
      # read is easy to miss precisely because the default token has it
      # implicitly when no `permissions:` block is present at all. Without
      # it explicitly here, `gh run view --log-failed` (fetching the test
      # job's log, the very first step below) would fail on every real run.
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the failed job's log
        # `gh run view --job <id> --log` refuses to serve ANY job's log
        # until the whole RUN is marked complete — verified live, not
        # assumed: this job is itself a job in that same run (`needs: test`
        # puts it downstream, not in a separate run), so "the whole run is
        # complete" can never be true while this step is executing. Not a
        # timing race that a retry would fix — a structural deadlock.
        # The raw REST endpoint has no such restriction: it only requires
        # the target job itself to be complete, which `test` already is by
        # the time this runs.
        run: |
          JOB_ID=$(gh run view "${{ github.run_id }}" --json jobs -q '.jobs[] | select(.name=="test") | .databaseId')
          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > failure.log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure git identity
        if: vars.AXIOM_MODE == 'automatic'
        run: |
          git config user.name "axiom-debug[bot]"
          git config user.email "axiom-debug@users.noreply.github.com"

      - name: React to the failure
        run: |
          if [ "${AXIOM_MODE}" = "automatic" ]; then
            python .github/scripts/apply_fix.py failure.log comment.md
          else
            python .github/scripts/report_ci_failure.py failure.log comment.md
          fi
        env:
          AXIOM_API_URL: ${{ vars.AXIOM_API_URL }}
          AXIOM_MODE: ${{ vars.AXIOM_MODE }}
          AXIOM_TEST_COMMAND: ${{ vars.AXIOM_TEST_COMMAND }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Post the diagnosis as a PR comment
        if: hashFiles('comment.md') != ''
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
